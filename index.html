<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LHIIS — Agentes de IA y Automatización para Empresas</title>
  <meta name="description" content="Implementamos agentes de IA, chatbots y sistemas a medida que hacen el trabajo repetitivo de tu equipo. Tu operación 24/7, sin rotación, sin IMSS." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // ── EmailJS config ──────────────────────────────────────────────
    // 1. Crea cuenta en https://www.emailjs.com (gratis, 200 emails/mes)
    // 2. Crea un Email Service (Gmail/SMTP) y copia el Service ID
    // 3. Crea un Email Template con las variables: {{from_name}}, {{company}},
    //    {{size}}, {{industry}}, {{pain}}, {{reply_to}}
    //    Configura "To Email": contacto@lhiis.com
    //    Agrega CC: eliasoscarfca@gmail.com
    // 4. Reemplaza los tres valores de abajo con los tuyos
    window.EMAILJS_PUBLIC_KEY  = 'Cq8DWV0u4k_Q_W3rk';
    window.EMAILJS_SERVICE_ID  = 'service_9p3bzrh';
    window.EMAILJS_TEMPLATE_ID = 'template_oo9madj';
    emailjs.init(window.EMAILJS_PUBLIC_KEY);
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: #1a0f28;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(132,11,255,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,0,96,0.08) 0%, transparent 60%);
      background-attachment: fixed;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a0f28; }
    ::-webkit-scrollbar-thumb { background: rgba(132,11,255,0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(132,11,255,0.7); }

    /* Range sliders */
    input[type=range] { -webkit-appearance: none; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.1); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #840bff, #ff0060); cursor: pointer; box-shadow: 0 0 10px rgba(132,11,255,0.5); }
    input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: none; border-radius: 50%; background: linear-gradient(135deg, #840bff, #ff0060); cursor: pointer; }

    /* Animations */
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Responsive: hide/show nav items */
    @media (max-width: 768px) {
      .nav-links-desktop, .nav-right-desktop { display: none !important; }
      .nav-hamburger { display: flex !important; }
      .hero-metrics { display: none !important; }
      .ecosystem-grid, .about-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
      .roi-grid { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 32px !important; }
      .steps-line { display: none !important; }
    }
    @media (max-width: 480px) {
      .footer-grid { grid-template-columns: 1fr !important; }
    }

    /* Selection color */
    ::selection { background: rgba(132,11,255,0.4); color: #fff; }
  </style>
</head>
<body>

<div id="root"></div>

<!-- Component scripts (order matters) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/Nav.jsx"></script>
<script type="text/babel" src="components/Hero.jsx"></script>
<script type="text/babel" src="components/Sections.jsx"></script>
<script type="text/babel" src="components/Final.jsx"></script>

<!-- Main App -->
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentPrimary": "#840bff",
  "accentSecondary": "#ff0060",
  "bgBase": "#1a0f28",
  "particleCount": 90,
  "showROICalc": true,
  "animationsEnabled": true,
  "chatWidgetEnabled": true
}/*EDITMODE-END*/;

const App = () => {
  const [lang, setLang] = React.useState('es');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <React.Fragment>
      <Nav lang={lang} setLang={setLang} />

      <main>
        <Hero lang={lang} />
        <ProblemSection lang={lang} />
        <ServicesSection lang={lang} />
        <EcosystemSection lang={lang} />
        {tweaks.showROICalc && <ROISection lang={lang} />}
        <CasesSection lang={lang} />
        <HowWeWorkSection lang={lang} />
        <AboutSection lang={lang} />
        <CTASection lang={lang} />
        <FAQSection lang={lang} />
        <Footer lang={lang} />
      </main>

      {tweaks.chatWidgetEnabled && <ChatWidget lang={lang} />}
      <WAButton lang={lang} />

      <TweaksPanel>
        <TweakSection label="Colores" />
        <TweakColor label="Violeta principal" value={tweaks.accentPrimary} onChange={v => setTweak('accentPrimary', v)} />
        <TweakColor label="Magenta acento" value={tweaks.accentSecondary} onChange={v => setTweak('accentSecondary', v)} />
        <TweakSection label="Funcionalidades" />
        <TweakToggle label="Calculadora de ROI" value={tweaks.showROICalc} onChange={v => setTweak('showROICalc', v)} />
        <TweakToggle label="Animaciones" value={tweaks.animationsEnabled} onChange={v => setTweak('animationsEnabled', v)} />
        <TweakToggle label="Chat Widget" value={tweaks.chatWidgetEnabled} onChange={v => setTweak('chatWidgetEnabled', v)} />
        <TweakSection label="Partículas Hero" />
        <TweakSlider label="Cantidad" value={tweaks.particleCount} min={20} max={200} step={10} onChange={v => setTweak('particleCount', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
