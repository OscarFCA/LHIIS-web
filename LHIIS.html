<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LHIIS — Agentes de IA y Automatización para Empresas</title>
  <meta name="description" content="Implementamos agentes de IA, chatbots y sistemas a medida que hacen el trabajo repetitivo de tu equipo. Tu operación 24/7, sin rotación, sin IMSS." />
  <link rel="icon" href="uploads/LHIISLogo.png" type="image/png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    window.EMAILJS_PUBLIC_KEY  = 'Cq8DWV0u4k_Q_W3rk';
    window.EMAILJS_SERVICE_ID  = 'service_9p3bzrh';
    window.EMAILJS_TEMPLATE_ID = 'template_oo9madj';
    emailjs.init(window.EMAILJS_PUBLIC_KEY);
  </script>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <img src="uploads/LHIISLogo.png" alt="LHIIS" class="loading-logo" style="border-radius: 8px" />
  </div>

  <div id="page-root">
    <div id="root"></div>
  </div>

<!-- Component scripts (order matters) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/Nav.jsx"></script>
<script type="text/babel" src="components/Hero.jsx"></script>
<script type="text/babel" src="components/Sections.jsx"></script>
<script type="text/babel" src="components/Final.jsx"></script>

<!-- Main App -->
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentPrimary": "#840bff",
  "accentSecondary": "#ff0060",
  "bgBase": "#0B0F1A",
  "particleCount": 90,
  "showROICalc": true,
  "animationsEnabled": true,
  "chatWidgetEnabled": true
}/*EDITMODE-END*/;

const App = () => {
  const [lang, setLang] = React.useState('es');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = React.useState(false);

  // Tweaks protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Fade-up on scroll (IntersectionObserver via page-root)
  React.useEffect(() => {
    const scrollRoot = document.getElementById('page-root');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.style.opacity = '1';
          e.target.style.transform = 'translateY(0)';
          obs.unobserve(e.target);
        }
      });
    }, { root: scrollRoot, threshold: 0.04, rootMargin: '0px 0px 80px 0px' });

    setTimeout(() => {
      document.querySelectorAll('.section').forEach(section => {
        section.querySelectorAll('.glass-card, .service-card, .filter-tab').forEach((el, i) => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(18px)';
          el.style.transition = `opacity 1.2s ease ${i * 0.04}s, transform 1.2s ease ${i * 0.04}s`;
          obs.observe(el);
        });
      });
    }, 100);

    return () => obs.disconnect();
  }, [lang]);

  // Nav scroll detection via page-root
  React.useEffect(() => {
    const root = document.getElementById('page-root');
    const nav = document.getElementById('main-nav');
    if (!root || !nav) return;
    const onScroll = () => {
      if (root.scrollTop > 50) nav.classList.add('nav-scrolled');
      else nav.classList.remove('nav-scrolled');
    };
    root.addEventListener('scroll', onScroll, { passive: true });
    return () => root.removeEventListener('scroll', onScroll);
  }, []);

  // Smooth anchor links via page-root
  React.useEffect(() => {
    const root = document.getElementById('page-root');
    const handleClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      const target = document.querySelector(a.getAttribute('href'));
      if (target && root) root.scrollTo({ top: target.offsetTop - 72, behavior: 'smooth' });
    };
    document.addEventListener('click', handleClick);
    return () => document.removeEventListener('click', handleClick);
  }, []);

  // Hide loading screen
  React.useEffect(() => {
    const loading = document.getElementById('loading');
    if (loading) setTimeout(() => loading.classList.add('hidden'), 600);
  }, []);

  return (
    <React.Fragment>
      <Nav lang={lang} setLang={setLang} />

      <main>
        <Hero lang={lang} />
        <ProblemSection lang={lang} />
        <ServicesSection lang={lang} />
        <EcosystemSection lang={lang} />
        {tweaks.showROICalc && <ROISection lang={lang} />}
        <CasesSection lang={lang} />
        <HowWeWorkSection lang={lang} />
        <AboutSection lang={lang} />
        <CTASection lang={lang} />
        <FAQSection lang={lang} />
        <Footer lang={lang} />
      </main>

      {tweaks.chatWidgetEnabled && <ChatWidget lang={lang} />}
      <WAButton lang={lang} />

      {showTweaks && (
        <TweaksPanel>
          <TweakSection label="Colores" />
          <TweakColor label="Violeta principal" value={tweaks.accentPrimary} onChange={v => setTweak('accentPrimary', v)} />
          <TweakColor label="Magenta acento" value={tweaks.accentSecondary} onChange={v => setTweak('accentSecondary', v)} />
          <TweakSection label="Funcionalidades" />
          <TweakToggle label="Calculadora de ROI" value={tweaks.showROICalc} onChange={v => setTweak('showROICalc', v)} />
          <TweakToggle label="Animaciones" value={tweaks.animationsEnabled} onChange={v => setTweak('animationsEnabled', v)} />
          <TweakToggle label="Chat Widget" value={tweaks.chatWidgetEnabled} onChange={v => setTweak('chatWidgetEnabled', v)} />
          <TweakSection label="Partículas Hero" />
          <TweakSlider label="Cantidad" value={tweaks.particleCount} min={20} max={200} step={10} onChange={v => setTweak('particleCount', v)} />
        </TweaksPanel>
      )}
    </React.Fragment>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
